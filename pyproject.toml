[project]
name = "PivotalFluxion"
version = "0.1.0"
requires-python = ">=3.11"
description = "Docs + tooling project with phase-specific extras."

# deps common to all phases
dependencies = [
  "mkdocs",
  "mkdocs-material",
]

[project.optional-dependencies]
plan = [
  "openpyxl",
  "faker",
  "jinja2",
  "pyyaml",
  "typer",
]

# dev tooling (install with: uv sync --group dev)
[tool.uv.dependency-groups]
dev = [
  "jsonschema",
  "ruff",
  "black",
  "mypy",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# scripts-only project: allow metadata-only wheel, don't fail on missing packages
bypass-selection = true
