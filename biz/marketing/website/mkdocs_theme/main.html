<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ config.site_name }}</title>
    {% for path in config.extra_css %}
    <link rel="stylesheet" href="{{ path | url }}">
    {% endfor %}
  </head>
  <body>
    <header>
      <h1>{{ config.site_name }}</h1>
    </header>
    <main>
      {{ page.content }}
    </main>
  </body>
</html>
